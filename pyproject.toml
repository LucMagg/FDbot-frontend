[project]
name = "fdbot-frontend"
version = "0.1.0"
description = ""
authors = [
    {name = "LucMagg",email = "luc.maggiotto@gmail.com"}
]
requires-python = "3.12.10"
dependencies = [
    "discord-py (>=2.7.1,<3.0.0)",
    "aiohttp (>=3.13.3,<4.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "google-api-python-client (>=2.192.0,<3.0.0)",
    "gspread (>=6.2.1,<7.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "emoji (>=2.15.0,<3.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
bot = "main:main"

[tool.poetry]
package-mode = false